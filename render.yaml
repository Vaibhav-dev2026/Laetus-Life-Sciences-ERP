# Render Blueprint for the Laetus ERP backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# This installs Chromium during the build so Puppeteer-based PDF generation
# (invoices, GST reports, ledgers) works on Render's free tier instead of
# silently falling back to an HTML file (see backend/src/services/pdf.service.js).
services:
  - type: web
    name: laetus-erp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "apt-get update && apt-get install -y chromium && npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: BACKUP_DIR
        value: backups
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
