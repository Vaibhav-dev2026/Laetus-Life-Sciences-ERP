# Render Blueprint for the Laetus ERP backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Uses standard npm ci to install Puppeteer and its bundled Chrome binary for PDF generation
# (invoices, GST reports, ledgers) on Render's free tier.
services:
  - type: web
    name: laetus-erp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "npm ci"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: BACKUP_DIR
        value: backups
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
